# mise.e14.toml — packages for e14 (the personal Mac) only, layered on mise.toml.
#
# mise loads this file only while the "e14" config environment is active. On
# e14 that comes from an untracked .miserc.toml in this directory:
#
#   printf 'env = ["e14"]\n' > .miserc.toml
#
# .miserc.toml is read before any other config, so `mise bootstrap` here picks
# this file up without MISE_ENV in the shell, and the env stays scoped to this
# repo instead of every project on the machine. Other machines (gfew, the VA
# GFE Mac, keeps its own Brewfile in gfe-config) never see these packages.
# [bootstrap.packages] from both files merge.

[bootstrap.packages]
# These were installed by hand before they were declared, and survived a
# 2026-10 triage that searched ~/Code, ~/bin, skills, LaunchAgents
# and shell history for each one. Notes mark the non-obvious dependents.
#
# Mail, calendar and messaging.
# isync provides mbsync, which ~/.local/bin/mbsync-lock wraps. neomutt renders
# HTML mail through w3m (~/.mailcap) and opens links with urlscan (Ctrl-U in
# .config/neomutt/neomuttrc).
"brew:isync" = { version = "latest", os = ["macos"] }
"brew:neomutt" = { version = "latest", os = ["macos"] }
"brew:w3m" = { version = "latest", os = ["macos"] }
"brew:urlscan" = { version = "latest", os = ["macos"] }
"brew:ajrosen/tap/icalpal" = { version = "latest", os = ["macos"] }
"brew:keith/formulae/reminders-cli" = { version = "latest", os = ["macos"] }
"brew:steipete/tap/remindctl" = { version = "latest", os = ["macos"] }
"brew:steipete/tap/imsg" = { version = "latest", os = ["macos"] }
# Project dependencies that nothing else declares.
# lego: botsun's lib/botsun/web_cert.rb issues its web certificate with it.
# sox: `botsun desk listen` plays the streamed desktop audio through it.
# pdftk-java: vets-api PDF stamping/datestamping, checked by its bin/setup.
# shared-mime-info: vets-api pins mimemagic 0.4.3, whose `bundle install`
#   needs the freedesktop MIME database.
# gnu-sed: acronyms' scripts/check-spelling.sh calls gsed directly.
"brew:lego" = { version = "latest", os = ["macos"] }
"brew:sox" = { version = "latest", os = ["macos"] }
"brew:pdftk-java" = { version = "latest", os = ["macos"] }
"brew:shared-mime-info" = { version = "latest", os = ["macos"] }
"brew:gnu-sed" = { version = "latest", os = ["macos"] }
# Linters, tests and code tooling.
# universal-ctags is the /opt/homebrew/bin/ctags that ~/.local/bin/ctags wraps.
"brew:actionlint" = { version = "latest", os = ["macos"] }
"brew:zizmor" = { version = "latest", os = ["macos"] }
"brew:scorecard" = { version = "latest", os = ["macos"] }
"brew:luacheck" = { version = "latest", os = ["macos"] }
"brew:yamllint" = { version = "latest", os = ["macos"] }
"brew:bats-core" = { version = "latest", os = ["macos"] }
"brew:kcov" = { version = "latest", os = ["macos"] }
"brew:cloc" = { version = "latest", os = ["macos"] }
"brew:hyperfine" = { version = "latest", os = ["macos"] }
"brew:onefetch" = { version = "latest", os = ["macos"] }
"brew:lua-language-server" = { version = "latest", os = ["macos"] }
"brew:universal-ctags" = { version = "latest", os = ["macos"] }
"brew:ripgrep-all" = { version = "latest", os = ["macos"] }
