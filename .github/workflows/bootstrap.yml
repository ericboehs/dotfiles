name: bootstrap

on:
  push:
    branches: [master]
  pull_request:

permissions: {} # default-deny; no job here needs the GITHUB_TOKEN

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      # Submodules are left to mise's pre-dotfiles hook so that the hook is
      # exercised rather than bypassed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run bootstrap
        env:
          # mise resolves tool versions from GitHub's releases API. Unauthenticated
          # runners share a 60 req/hr pool per IP and this job has already failed
          # a run with 403s on it. The job's existing contents: read is all the
          # token needs, and it lifts the ceiling well clear of what a run costs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mise trust
          # tools: the runtimes in [tools] take far longer than this job is
          #   worth; task: bootstrap:nvim compiles every treesitter parser.
          mise bootstrap -y --force-dotfiles --skip tools,task
          # The one task that is cheap and Linux-specific — it creates the
          # fd/bat shims the next step asserts on.
          mise run bootstrap:linux-shims
          # ~/.config/mise/config.toml is a symlink into the repo as of the
          # dotfiles step above, so it needs trusting before it can be read.
          mise trust ~/.config/mise/config.toml
          # neovim moved out of apt and into [tools], and this job skips the
          # tools step wholesale, so install just the editor. It is the one
          # tool with a hard minimum version — LazyVim refuses to load below
          # it — which the next step asserts.
          mise install neovim

      - name: Verify dotfiles converged
        run: mise bootstrap dotfiles status --missing

      # nvim is deliberately not in this loop — these are the apt-provided
      # tools, and the editor now comes from [tools]. It gets its own check.
      - name: Verify CLI tools installed
        run: |
          set -e
          for cmd in zsh lsd zoxide fzf tmux rg gh delta; do
            command -v "$cmd" >/dev/null || { echo "missing: $cmd"; exit 1; }
          done
          test -x "$HOME/.local/bin/fd"
          test -x "$HOME/.local/bin/bat"

      # Regression test for a real failure: apt's neovim was 0.10.4 against
      # LazyVim's 0.11.2 floor, so the editor would not load on a bootstrapped
      # Linux box — and bootstrap:nvim hung forever rather than saying so,
      # because LazyVim reports the problem with a keypress prompt that
      # --headless can never answer.
      - name: Verify neovim meets LazyVim's floor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          floor=0.11.2
          v=$(mise exec -- nvim --version | sed -n '1s/^NVIM v\([0-9][0-9.]*\).*/\1/p')
          [ -n "$v" ] || { echo "could not read nvim version"; exit 1; }
          [ "$(printf '%s\n%s\n' "$floor" "$v" | sort -V | head -1)" = "$floor" ] \
            || { echo "neovim $v is below LazyVim's $floor floor"; exit 1; }
          echo "neovim $v (floor $floor)"

      - name: Verify re-running is a no-op
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          before=$(find "$HOME" -maxdepth 3 -type l 2>/dev/null | sort | sha256sum)
          mise bootstrap -n --skip tools,task > /dev/null
          after=$(find "$HOME" -maxdepth 3 -type l 2>/dev/null | sort | sha256sum)
          [ "$before" = "$after" ] || { echo "dry-run modified state"; exit 1; }

  pi-extensions:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      # bin/pi-ext-check borrows its types from the globally installed pi rather
      # than pinning versions of its own, so CI has to reproduce that install.
      # Both versions come from the tracked pins that bootstrap uses, so an
      # upgrade lands in CI and on the machine together.
      - name: Install node and pi at the tracked pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # mise resolves versions via the releases API
        run: |
          set -e
          config=.config/mise/config.toml
          node_version=$(sed -n 's/^node = "\([^"]*\)"$/\1/p' "$config")
          pi_version=$(sed -n 's|^"npm:@earendil-works/pi-coding-agent" = "\([^"]*\)"$|\1|p' "$config")
          [ -n "$node_version" ] || { echo "no node pin in $config"; exit 1; }
          [ -n "$pi_version" ] || { echo "no pi pin in $config"; exit 1; }
          echo "node $node_version, pi $pi_version"
          mise use -g "node@$node_version"
          # Plain npm, not mise's npm backend: pi-ext-check resolves the install
          # through `npm root -g`, which only sees the active node's prefix.
          npm install -g "@earendil-works/pi-coding-agent@$pi_version"

      # Import guard, tsc and the extension test suite. tsc alone would pass on
      # an extension that imports a gitignored helper, which aborts pi's launch
      # on every host but this one — exactly what CI is here to catch.
      - name: Check pi extensions
        run: bin/pi-ext-check

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      # Ubuntu ships 0.9.0 and this machine runs 0.11.0, which disagree about
      # what is clean, so take the version from the same tracked pin bootstrap
      # installs rather than from apt.
      - name: Install shellcheck at the tracked pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # mise resolves versions via the releases API
        run: |
          set -e
          version=$(sed -n 's/^shellcheck = "\([^"]*\)"$/\1/p' .config/mise/config.toml)
          [ -n "$version" ] || { echo "no shellcheck pin in .config/mise/config.toml"; exit 1; }
          mise use -g "shellcheck@$version"
          shellcheck --version

      # Every tracked bash/sh script, not just .tmux/*.sh. Scripts with
      # pre-existing warnings are listed in .shellcheck-legacy and held to parse
      # errors only; the list can only shrink, so this ratchets rather than
      # demanding one big cleanup up front.
      - name: Run shellcheck
        run: bin/shell-lint
