set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'catppuccin/tmux'

# Default configurations
set-option -g base-index 1 # Start window index count at 1 instead of 0
setw -g mouse on           # Enable mouse mode: scrolling, pane selecting and window selecting
setw -g mode-keys vi       # use vim keys while in copy mode
set -g allow-passthrough all
setw -g monitor-activity on # Monitor activity in windows
# set -g monitor-silence 0    # Don't monitor silence
# set -g activity-action other # Only trigger on substantial activity
setw -g monitor-bell on     # Monitor bell in windows
set -g bell-action any      # Ring bell for any window
set -g renumber-windows on  # Automatically renumber windows when one is closed
set -g history-limit 500000 # Set very high to prevent claude code scrollback lag
setw -g automatic-rename on
# Cap auto window names at 20 chars so long commands don't blow out the status row
setw -g automatic-rename-format '#{?pane_in_mode,[tmux],#{=20:pane_current_command}}#{?pane_dead,[dead],}'

# Name the terminal window/tab after the attached session. Ghostty labels a tab
# with the running command otherwise ("tmux -u attach"), which says nothing when
# several tabs are open — and tmux-focus (the Claude notification click action)
# matches on the "session:" prefix to raise the tab tmux is actually in.
set -g set-titles on
# The machine being sat at needs no prefix - nobody is looking in from outside,
# so it would be noise on every tab.
set -g set-titles-string "#S:#I #{=20:pane_title}"
# A box reached over ssh prefixes the name you reach it by, so a clicked
# notification can tell its tab apart from an identically named local session.
# The format is emitted whole by the script - tmux expands formats in a run-shell
# command before the shell sees them, so no # may appear on this line.
run-shell -b 'tmux set -g set-titles-string "$($HOME/bin/tmux-title-format)"'

set -g default-terminal "tmux-256color"
# True colour, plus the DECSCUSR sequences for the cursor shape.
#
# Written to explicit indices rather than appended with -a. These are array
# options, and -a adds a fresh entry each time instead of replacing one, so every
# source-file grew the list by another copy of all four lines — a server that had
# been reloaded through a day's editing was holding 82 of them. The index only
# has to clear tmux's own defaults, which start at 0.
set -s terminal-overrides[100] "xterm-256color:Tc"
set -s terminal-overrides[101] "xterm-ghostty:Tc"
set -s terminal-overrides[102] "*:Ss=\\E[%p1%d q:Se=\\E[2 q"
set -s terminal-features[100] "xterm-ghostty:hyperlinks"
set -g extended-keys on
set -g extended-keys-format csi-u

# Clear the bright needs-attention index once the pane has actually been looked at
set-hook -g pane-focus-in 'set-window-option -u @special_activity; set-window-option -u @job_done'
# Pane border colors set dynamically by ~/.tmux/theme-sync.sh (light/dark)

# Plugin configurations
set -g @open-S 'https://google.com/search?q=' # tmux-open Shift-S won't work w/i this
set -g @catppuccin_window_status_enable "yes" # Adds icons to each window (including if it's zoomed)
set -g @catppuccin_window_right_separator " " # Needed as icon was getting cut off

# Yank without leaving copy mode
set -g @yank_action 'copy-pipe'

# One status row per session (colors set dynamically by theme-sync.sh). The
# generator preserves creation order and adjusts the status height whenever a
# session opens or closes. tmux caps the status area at five rows; overflow
# sessions share the fifth row rather than disappearing.
#
# tmux's 500ms default would redraw twice a second for nothing. Nothing in
# status-format forks anymore (status-daemon.sh publishes the GPU, load, theme
# and agent state as options), so this only paces redraws.
set-option -g status-interval 5
set-hook -g session-created[100] 'run-shell -b ~/.tmux/status-sessions.sh'
set-hook -g session-closed[100] 'run-shell -b ~/.tmux/status-sessions.sh'
run-shell '~/.tmux/status-sessions.sh'
# Prefix+S toggles other sessions' rows. Collapsed mode is one row that still
# follows whichever session this client is attached to.
bind S run-shell '~/.tmux/status-sessions.sh toggle'

# pi canvas: tell the canvas daemon which pane is current, so a canvas tab in
# "Follow tmux" mode opens that pi session's page (the page moves tmux the
# other way itself). Non-pi panes are ignored; PI_CANVAS_TMUX=0 on the daemon
# turns it off. One move can fire more than one of these; the daemon dedupes.
set-hook -g session-window-changed[200] 'run-shell -b "~/.tmux/canvas-follow.sh #{pane_id} #{socket_path}"'
set-hook -g client-session-changed[200] 'run-shell -b "~/.tmux/canvas-follow.sh #{pane_id} #{socket_path}"'
set-hook -g after-select-pane[200] 'run-shell -b "~/.tmux/canvas-follow.sh #{pane_id} #{socket_path}"'
# Prefix+Shift-N prompts for a session name, attaching if it exists
# (-A) and creating it otherwise.
bind N command-prompt -p "Session:" "new-session -A -s '%%'"

# Session labels and windows in generated rows switch directly to their target
# when clicked. Opt-` / Opt-~ cycle from the keyboard in both directions.
#
# Next/previous in creation order, like Prefix+s and Ctrl-Shift-1..9, without a
# shell (each exec pays an endpoint-security check here). The session loop's
# second format marks the current session, so "$0 >$1 $3" reads as: next is the
# entry after ">", previous the one before it. An unmarked copy appended (next)
# or prepended (previous) makes the ends wrap round. run-shell -C expands that
# and switches in tmux. session-jump.sh stays for pane-nav.sh's zoomed case.
bind -n 'M-`' run-shell -C "switch-client -t '#{s/^.*>[^ ]+ ([^ ]+).*/\\1/:#{S/i:#{session_id} ,>#{session_id} }#{S/i:#{session_id} }}'"
bind -n 'M-~' run-shell -C "switch-client -t '#{s/^(.* )?([^ ]+) >.*/\\2/:#{S/i:#{session_id} }#{S/i:#{session_id} ,>#{session_id} }}'"

# Opt-Tab / Opt-Shift-Tab cycle through windows.
#
# Ctrl-h/l and Ctrl-j/k (at the bottom of this file) now cycle windows and
# sessions too, and more directly, so these four Opt bindings are redundant on
# this machine. They stay because Opt keys are plain escape sequences: they are
# the only way to cycle from a terminal that cannot send Ctrl-Shift-anything,
# i.e. Blink on iOS, which is also why the user-keys block below exists.
bind -n M-Tab next-window
bind -n M-BTab previous-window

# Click the GPU/load average (range=right) to open btop (already sorted by CPU).
# goto-window.sh reuses the window if one is already open in this session.
bind -n MouseDown1StatusRight run-shell '~/.tmux/goto-window.sh "#{session_name}" btop ~/.tmux/btop.sh'

# Clicking the plus (range=user|new-window) opens zsh with "pi" prefilled, waiting for Enter.
# The delayed background send targets the new pane explicitly, so the input
# cannot be delivered to the pane that was active when the click happened.
# Opt-clicking the plus opens a plain window in the current pane's directory,
# and Opt-clicking a window index toggles its bold needs-attention mark
# (mark-window.sh) without switching away from the window you are on.
# Clicking the current window's index prompts to kill it; other window clicks
# switch. Window ranges carry an explicit session:window target so clicks can
# jump across sessions.
#
# The kill prompt waits for the release (MouseUp1Status) so that pressing on
# the current window can start a drag instead. The press arms it by recording
# the range in @status_kill_armed; the release prompts only if it lands on the
# same, still-current window. A press that switched windows clears the arm, so
# releasing on the window you just switched to does not prompt. A drag ends with
# MouseDragEnd1Status rather than MouseUp1Status, and the drag binding clears
# the arm too.
bind -n MouseDown1Status {
  if-shell -F '#{==:#{mouse_status_range},new-window}' {
    run-shell -b 'fmt=$(printf '\''\043{pane_id}'\''); pane=$(tmux new-window -t "#{session_name}:" -P -F "$fmt" -c "#{pane_current_path}"); tmux switch-client -c "#{client_name}" -t "$pane"; sleep 0.2; tmux send-keys -t "$pane" -l -- pi'
  } {
    if-shell -F '#{m/r:^\$,#{mouse_status_range}}' {
      if-shell -F '#{==:#{mouse_status_range},#{session_id}:#{window_index}}' {
        set-option -gF @status_kill_armed '#{mouse_status_range}'
      } {
        set-option -gu @status_kill_armed
        # run-shell -C expands the mouse format and runs the result as a tmux
        # command, with no shell: every exec here pays an endpoint-security check
        # (15–530ms). Single quotes keep the $ session ID literal for tmux's parser.
        run-shell -C "switch-client -c '#{client_name}' -t '#{mouse_status_range}'"
      }
    } {
      switch-client -t =
    }
  }
}
bind -n MouseUp1Status if-shell -F '#{&&:#{==:#{mouse_status_range},#{@status_kill_armed}},#{==:#{mouse_status_range},#{session_id}:#{window_index}}}' {
  set-option -gu @status_kill_armed
  confirm-before -y -p "kill-window #I:#W? (Y/n)" kill-window
} {
  set-option -gu @status_kill_armed
}

# Drag a window index along the status line to reorder it. The press already
# made the grabbed window current, and each drag event swaps it with the window
# under the cursor, so it walks one slot at a time. swap-window leaves focus on
# the old index, so select-window follows the moved window; otherwise the next
# drag event would grab its neighbour. run-shell -C expands the formats and runs
# both as tmux commands, no shell: this fires on every slot crossed, and each
# exec would pay an endpoint-security check (15–530ms). Only window ranges in the current session count: the status line
# also lists other sessions' windows, and swapping with one of those would move
# windows between sessions.
bind -n MouseDrag1Status {
  set-option -gu @status_kill_armed
  if-shell -F '#{&&:#{m/r:^\$[0-9]+:[0-9]+$,#{mouse_status_range}},#{&&:#{m:#{session_id}:*,#{mouse_status_range}},#{!=:#{mouse_status_range},#{session_id}:#{window_index}}}}' {
    run-shell -C "swap-window -s '#{session_id}:#{window_index}' -t '#{mouse_status_range}' ; select-window -t '#{mouse_status_range}'"
  }
}
bind -n MouseDragEnd1Status set-option -gu @status_kill_armed
#
# Only the window ranges are marked. Session labels and the GPU/load
# readings have no window to carry the mark, and the plus keeps its own job.
# A session name cannot contain a colon, so "^[^:]+:[0-9]+$" matches exactly the
# window ranges.
#
# Ghostty is the only terminal here that reports Option on a click: it sends the
# alt bit in the mouse report (with macos-option-as-alt = true), and tmux turns
# that into this M- binding. iTerm2 and Terminal.app send Esc ahead of the
# click instead, which tmux reads as a bare Escape followed by an unmodified
# click — i.e. the plain MouseDown1Status, which switches windows.
bind -n M-MouseDown1Status if-shell -F '#{==:#{mouse_status_range},new-window}' {
  new-window -c "#{pane_current_path}"
} {
  if-shell -F '#{m/r:^[^:]+:[0-9]+$,#{mouse_status_range}}' {
    # Double quotes outside, single quotes around the range: run-shell expands
    # the mouse format first, and the range it hands over still starts with a
    # literal $ (the session id) that the shell must not eat. Same guard as the
    # plain-click switch-client below.
    run-shell "~/.tmux/mark-window.sh '#{mouse_status_range}'"
  }
}

# Keybindings
bind-key Escape copy-mode # Prefix + Escape to enter copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection # Make v work like you'd expect in copy mode
bind-key -T copy-mode-vi Escape send-keys -X cancel
# Space speaks the selection. kk is Kokoro-82M on MLX and so Apple Silicon only;
# ~/bin/kk is a symlink into a checkout that a Linux box does not have, leaving
# the binding piping every selection into a dangling symlink. Fall back to a
# plain copy there, which is what the key would have done anyway.
if-shell 'command -v kk >/dev/null 2>&1' {
  bind-key -T copy-mode-vi Space send-keys -X copy-pipe "kk stop >/dev/null 2>&1; kk say"
} {
  bind-key -T copy-mode-vi Space send-keys -X copy-selection-no-clear
}

# Override tmux-copycat's Ctrl-F to page forward instead of file search
bind-key -T copy-mode-vi C-f send-keys -X page-down

# Fuzzy pane finder: prefix+s as an expanded tree, filtered by pane title.
# Session headings stay put; only their windows/panes filter down.
bind F display-popup -E -w 90% -h 80% '~/.tmux/pane-find.sh'

# Make session chooser start from 1 instead of 0. See: https://unix.stackexchange.com/a/755474.
bind-key s choose-tree -ZsK '#{?#{e|<:#{line},9},#{e|+:1,#{line}},#{?#{e|<:#{line},35},M-#{a:#{e|+:97,#{e|-:#{line},9}}},}}'

# Clear screen + scrollback. Ctrl-l navigates panes/windows and so never reaches
# the shell, and Ctrl-Shift-l now moves the window right, leaving Opt-l free for
# the one thing Ctrl-l used to be for.
# run-shell -d waits without starting a process (sleep would be two execs).
bind -n M-l send-keys C-l \; run-shell -d 0.2 \; clear-history

# Switch windows via Ctrl+number (needs a terminal that sends CSI-u keys)
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9

# Switch windows via Ctrl+number for Blink/iOS (user-keys with custom escape sequences)
# Blink Custom Presses: set Ctrl-N to custom string \x1b[4N;9~ (e.g. Ctrl-1 = \x1b[41;9~)
set -s user-keys[0] "\e[41;9~"
set -s user-keys[1] "\e[42;9~"
set -s user-keys[2] "\e[43;9~"
set -s user-keys[3] "\e[44;9~"
set -s user-keys[4] "\e[45;9~"
set -s user-keys[5] "\e[46;9~"
set -s user-keys[6] "\e[47;9~"
set -s user-keys[7] "\e[48;9~"
set -s user-keys[8] "\e[49;9~"
bind -n User0 select-window -t 1
bind -n User1 select-window -t 2
bind -n User2 select-window -t 3
bind -n User3 select-window -t 4
bind -n User4 select-window -t 5
bind -n User5 select-window -t 6
bind -n User6 select-window -t 7
bind -n User7 select-window -t 8
bind -n User8 select-window -t 9

# Switch sessions via Ctrl-Shift+number (sorted by creation time to match Prefix+s).
# Ghostty emits these as modifyOtherKeys sequences of its own accord.
# All in formats, no shell (each exec pays an endpoint-security check here):
# #{S/i:...} lists session ids in index order, which is creation order since ids
# only grow; the regex skips n-1 entries and keeps the next; run-shell -C runs
# the switch in tmux. The if -F guard makes a slot past the last session a no-op.
# (No {n} repeat in the regex: a "}" there would end the #{...} early.)
bind -n C-S-1 if -F '#{m/r:^[^ ]+,#{S/i:#{session_id} }}' { run-shell -C "switch-client -t '#{s/^([^ ]+).*/\\1/:#{S/i:#{session_id} }}'" }
bind -n C-S-2 if -F '#{m/r:^[^ ]+ [^ ]+,#{S/i:#{session_id} }}' { run-shell -C "switch-client -t '#{s/^[^ ]+ ([^ ]+).*/\\1/:#{S/i:#{session_id} }}'" }
bind -n C-S-3 if -F '#{m/r:^[^ ]+ [^ ]+ [^ ]+,#{S/i:#{session_id} }}' { run-shell -C "switch-client -t '#{s/^[^ ]+ [^ ]+ ([^ ]+).*/\\1/:#{S/i:#{session_id} }}'" }
bind -n C-S-4 if -F '#{m/r:^[^ ]+ [^ ]+ [^ ]+ [^ ]+,#{S/i:#{session_id} }}' { run-shell -C "switch-client -t '#{s/^[^ ]+ [^ ]+ [^ ]+ ([^ ]+).*/\\1/:#{S/i:#{session_id} }}'" }
bind -n C-S-5 if -F '#{m/r:^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+,#{S/i:#{session_id} }}' { run-shell -C "switch-client -t '#{s/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ ([^ ]+).*/\\1/:#{S/i:#{session_id} }}'" }
bind -n C-S-6 if -F '#{m/r:^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+,#{S/i:#{session_id} }}' { run-shell -C "switch-client -t '#{s/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ ([^ ]+).*/\\1/:#{S/i:#{session_id} }}'" }
bind -n C-S-7 if -F '#{m/r:^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+,#{S/i:#{session_id} }}' { run-shell -C "switch-client -t '#{s/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ ([^ ]+).*/\\1/:#{S/i:#{session_id} }}'" }
bind -n C-S-8 if -F '#{m/r:^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+,#{S/i:#{session_id} }}' { run-shell -C "switch-client -t '#{s/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ ([^ ]+).*/\\1/:#{S/i:#{session_id} }}'" }
bind -n C-S-9 if -F '#{m/r:^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+,#{S/i:#{session_id} }}' { run-shell -C "switch-client -t '#{s/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ ([^ ]+).*/\\1/:#{S/i:#{session_id} }}'" }

# Neovim :terminal bindings for fading inactive panes
# set-option -g default-command 'nvim +terminal +startinsert +"autocmd TermClose * ++once quit"'

# Emoji selector
bind e run-shell 'tmux new-window "ranger ~/Code/slack-emojis/; sleep 0.2; buffer=\$(tmux show-buffer); if [[ \$buffer != *$'\''\n'\''* ]]; then tmux send-keys -t #{pane_id} \"\$buffer\"; fi"'
bind g new-window "ranger /Users/ericboehs/.local/share/weechat/xfer"
# pi in a new window. Deliberately not `zsh -ic`: -i reads .zshrc, and pi waits
# on the whole interactive startup before its first byte — zoxide, compinit,
# p10k, fast-syntax-highlighting, and above all fnox, which resolves secrets
# twice there (`fnox activate` does the global config, then _fnox_hook merges
# the directory's fnox.toml on top), each pass a round trip to 1Password.
#
# `zsh -c` reads .zshenv alone, which is where PATH now lives, and one
# `fnox exec` resolves global and project secrets together — half the op
# traffic, and pi still passes them to anything it shells out to.
#
# When pi quits the window closes with it (no fallback shell).
#
# Measured window-open to pi: 0.50s -> 0.33s in a directory with no fnox.toml.
# Under one that has 14 op:// refs both are far slower, and that cost is
# 1Password's, not tmux's.
bind C new-window -c "#{pane_current_path}" "zsh -c 'fnox --if-missing ignore exec -- pi'"
# psst: find-or-create a window named psst in this session (Prefix+P).
bind P run-shell '~/.tmux/goto-window.sh "#{session_name}" psst zsh -c psst'
# Resume the agent that just quit in this pane. Reads the
# "To resume this session: ..." line pi prints on exit (or
# <agent> --continue if that banner is gone). See agent-resume.sh.
bind r run-shell '~/.tmux/agent-resume.sh #{pane_id}'
bind m set mouse \; display "Mouse #{?mouse,on,off}"
# Move the current pane to another session/window. Tab completes targets
# (popup list when ambiguous). e.g. type "be" Tab -> beta:1
bind M command-prompt -T target -p "Move pane to (session:window):" "break-pane -t %%"

# Toggle between the current session and the "notes" session (📝). A format
# check, not a shell: each exec pays an endpoint-security check here.
bind-key C-w \
    if -F '#{==:#{session_name},📝}' \
    "switch-client -l" \
    "switch-client -t 📝"

# Daily note in a 50/50 full-height split. bin/daily-note creates today's
# note with the wiki template when missing, then execs the editor. (The old
# command, "nvim -c VimwikiMakeDiaryNote", failed with E492 at startup:
# vimwiki is lazy-loaded on BufEnter *.md, so the command did not exist in
# a fresh nvim.)
bind-key W split-window -fh -p 50 '"$HOME/bin/daily-note" nvim'

# Apply theme based on macOS appearance now, then keep it (and the status
# bar's GPU/load/agent state) fresh from one background loop per server.
# Reloading the config is safe: the daemon exits if one is already running.
run-shell '~/.tmux/theme-sync.sh'
run-shell -b '~/.tmux/status-daemon.sh'

# Allow custom configuration
if '[ -f ~/.tmux.conf.local ]' 'source ~/.tmux.conf.local'

# Initialize TMUX plugin manager (keep this line below all plugin declarations)
run '~/.tmux/plugins/tpm/tpm'

# --- Ctrl-hjkl navigation -----------------------------------------------------
#
# These stay below tpm. vim-tmux-navigator used to live here and bound
# Ctrl-h/j/k/l itself, and whoever binds last wins; it is gone now, but a plugin
# is still free to claim these keys, and being below the plugins settles that in
# advance. run-shell without -b blocks the config queue until tpm has finished,
# so this really is read last.
#
# Ctrl-h/j/k/l move between panes and keep going past the last one: h/l into the
# previous/next window, j/k into the previous/next session. The if-shell test is
# vim-tmux-navigator's, kept along with Ctrl-\ and the copy-mode bindings when
# the plugin was dropped, so that vim, nvim and fzf still see the keys first and
# get to move their own splits.
#
# Ctrl-Shift-h/j/k/l are the same directions with the window in tow: h/l reorder
# the window inside the session, j/k send it to another session and follow it.
#
# Ctrl-Shift-anything depends on the terminal sending a sequence that can be told
# apart from the plain Ctrl key. tmux only knows how to ask for that through
# xterm's modifyOtherKeys and never sends the request under TERM=xterm-ghostty,
# so nothing here is negotiated — Ghostty simply emits the sequences anyway.
# Were it not doing so, Ctrl-Shift-h would arrive as a bare 0x08 and silently run
# Ctrl-h instead, which is worth remembering on any other terminal. Note tmux 3.7
# treats C-H as its own (unreachable) key name, so these must be spelled C-S-h.
# tmux run-shell exports TMUX but not TMUX_PANE, so the pane has to be handed to
# the script explicitly as #{pane_id}.
#
# Everything common is decided from formats, without starting a process: on this
# machine endpoint security (SentinelOne, Red Canary) checks every exec, 15–530ms
# each, and the old `if-shell "ps | grep"` + `run-shell pane-nav.sh` chain ran
# ~7 of them per press, so Ctrl-h/l window switches took 1–4s. Now vim is spotted
# from #{pane_current_command}, a move to a neighbouring pane or to the
# previous/next window happens in tmux, and pane-nav.sh only runs for the rare
# cases it exists for: a zoomed or floating pane; j/k at an edge jump sessions
# with the same formats as M-` / M-~. A mise shim stays in front of what it launches (nvim shows up as
# "mise"), so a pane whose command is mise falls back to the old ps check.
%hidden IS_VIM="#{m/ri:^g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}"
%hidden VIA_SHIM="#{==:#{pane_current_command},mise}"
%hidden IS_VIM_PS="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
%hidden NAV_SCRIPT="#{||:#{window_zoomed_flag},#{pane_floating_flag}}"
bind -n C-h if -F "$IS_VIM" 'send-keys C-h' { if -F "$VIA_SHIM" { if-shell "$IS_VIM_PS" 'send-keys C-h' 'run-shell "~/.tmux/pane-nav.sh h #{pane_id}"' } { if -F "$NAV_SCRIPT" { run-shell "~/.tmux/pane-nav.sh h #{pane_id}" } { if -F '#{pane_at_left}' { if -F '#{e|>:#{session_windows},1}' { previous-window } } { select-pane -L } } } }
bind -n C-l if -F "$IS_VIM" 'send-keys C-l' { if -F "$VIA_SHIM" { if-shell "$IS_VIM_PS" 'send-keys C-l' 'run-shell "~/.tmux/pane-nav.sh l #{pane_id}"' } { if -F "$NAV_SCRIPT" { run-shell "~/.tmux/pane-nav.sh l #{pane_id}" } { if -F '#{pane_at_right}' { if -F '#{e|>:#{session_windows},1}' { next-window } } { select-pane -R } } } }
bind -n C-j if -F "$IS_VIM" 'send-keys C-j' { if -F "$VIA_SHIM" { if-shell "$IS_VIM_PS" 'send-keys C-j' 'run-shell "~/.tmux/pane-nav.sh j #{pane_id}"' } { if -F "$NAV_SCRIPT" { run-shell "~/.tmux/pane-nav.sh j #{pane_id}" } { if -F '#{pane_at_bottom}' { run-shell -C "switch-client -t '#{s/^.*>[^ ]+ ([^ ]+).*/\\1/:#{S/i:#{session_id} ,>#{session_id} }#{S/i:#{session_id} }}'" } { select-pane -D } } } }
bind -n C-k if -F "$IS_VIM" 'send-keys C-k' { if -F "$VIA_SHIM" { if-shell "$IS_VIM_PS" 'send-keys C-k' 'run-shell "~/.tmux/pane-nav.sh k #{pane_id}"' } { if -F "$NAV_SCRIPT" { run-shell "~/.tmux/pane-nav.sh k #{pane_id}" } { if -F '#{pane_at_top}' { run-shell -C "switch-client -t '#{s/^(.* )?([^ ]+) >.*/\\2/:#{S/i:#{session_id} }#{S/i:#{session_id} ,>#{session_id} }}'" } { select-pane -U } } } }

# Ctrl-\ jumps back to the pane you came from, inherited from vim-tmux-navigator
# along with the copy-mode bindings below, which are the only reason the plugin
# was still installed. Written out here it needs one backslash, not the four the
# plugin ended up sending: it built this line as a shell string inside an
# if-shell, and the extra escaping leaked a stray literal into the pane.
# Same vim check as Ctrl-h/j/k/l above: formats, with the ps fallback only when
# the pane's command is the mise shim.
bind -n 'C-\' if -F "$IS_VIM" 'send-keys C-\' { if -F "$VIA_SHIM" { if-shell "$IS_VIM_PS" 'send-keys C-\' 'select-pane -l' } { select-pane -l } }

# Copy mode has no vim to defer to, so these go straight to the script. Same
# behaviour as outside copy mode, including falling out of the window at the
# edge; the script leaves a pane alone while a selection is being made, since
# resizing one throws the selection away.
bind -T copy-mode-vi C-h run-shell "~/.tmux/pane-nav.sh h #{pane_id}"
bind -T copy-mode-vi C-j run-shell "~/.tmux/pane-nav.sh j #{pane_id}"
bind -T copy-mode-vi C-k run-shell "~/.tmux/pane-nav.sh k #{pane_id}"
bind -T copy-mode-vi C-l run-shell "~/.tmux/pane-nav.sh l #{pane_id}"
bind -T copy-mode-vi 'C-\' select-pane -l

# Escape hatch for the keys taken above: prefix Ctrl-h/j/k/l sends the literal
# control character to the pane, so readline still gets C-k (kill to end of
# line), C-l (clear) and so on. These also have to sit below tpm —
# tmux-pain-control binds prefix C-h/j/k/l to select-pane, which is what plain
# prefix h/j/k/l already do, so nothing is lost by claiming them here.
bind C-h send-keys 'C-h'
bind C-j send-keys 'C-j'
bind C-k send-keys 'C-k'
bind C-l send-keys 'C-l'

# Move the current window one place left/right, wrapping at the ends, in
# formats (no shell; each exec pays an endpoint-security check here). As with
# M-` above: the window loop marks the current window ("0 >1 3", list order, so
# gaps in the indexes don't matter), the regex takes the neighbour, and an
# unmarked copy makes the ends wrap. swap-window -d keeps focus on the window
# that moved. A single window stays put.
bind -n C-S-h if -F '#{e|>:#{session_windows},1}' { run-shell -C "swap-window -d -s '#{session_id}:#{window_index}' -t '#{session_id}:#{s/^(.* )?([^ ]+) >.*/\\2/:#{W:#{window_index} }#{W:#{window_index} ,>#{window_index} }}'" }
bind -n C-S-l if -F '#{e|>:#{session_windows},1}' { run-shell -C "swap-window -d -s '#{session_id}:#{window_index}' -t '#{session_id}:#{s/^.*>[^ ]+ ([^ ]+).*/\\1/:#{W:#{window_index} ,>#{window_index} }#{W:#{window_index} }}'" }
# Take the current window to the next/previous session (same order as M-`),
# formats only: nothing with one session; refuse to empty a session, since moving
# its last window would destroy it; renumber the source (renumber-windows doesn't
# fire on a move); follow the window by id, which survives the move.
bind -n C-S-j if -F '#{e|<:#{server_sessions},2}' { } { if -F '#{e|<:#{session_windows},2}' { display-message "Not moved: #{session_name} has only one window" } { run-shell -C "move-window -s '#{window_id}' -t '#{s/^.*>[^ ]+ ([^ ]+).*/\\1/:#{S/i:#{session_id} ,>#{session_id} }#{S/i:#{session_id} }}:' ; move-window -r -t '#{session_id}' ; switch-client -t '#{s/^.*>[^ ]+ ([^ ]+).*/\\1/:#{S/i:#{session_id} ,>#{session_id} }#{S/i:#{session_id} }}' ; select-window -t '#{window_id}'" } }
bind -n C-S-k if -F '#{e|<:#{server_sessions},2}' { } { if -F '#{e|<:#{session_windows},2}' { display-message "Not moved: #{session_name} has only one window" } { run-shell -C "move-window -s '#{window_id}' -t '#{s/^(.* )?([^ ]+) >.*/\\2/:#{S/i:#{session_id} }#{S/i:#{session_id} ,>#{session_id} }}:' ; move-window -r -t '#{session_id}' ; switch-client -t '#{s/^(.* )?([^ ]+) >.*/\\2/:#{S/i:#{session_id} }#{S/i:#{session_id} ,>#{session_id} }}' ; select-window -t '#{window_id}'" } }
