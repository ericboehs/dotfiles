# mise.toml — declarative machine setup, run with `mise bootstrap` from this dir.
#
#   mise bootstrap -n                    # preview everything
#   mise bootstrap                       # converge
#   mise bootstrap --only dotfiles       # just the symlinks
#   mise bootstrap --skip macos-defaults # everything but the system prefs
#
# Prerequisites (chicken-and-egg — mise has to exist before it can bootstrap):
#   curl -fsSL https://mise.run | sh
#   git clone https://github.com/ericboehs/dotfiles ~/Code/github.com/ericboehs/dotfiles
#   cd ~/Code/github.com/ericboehs/dotfiles && mise trust && mise bootstrap

# [bootstrap.packages] entries below use per-package `os` filters, which older
# mise rejects with a bare "invalid type: map, expected a string".
min_version = "2026.8.4"

[env]
REPO_PATH = "ericboehs/dotfiles"
# Homebrew is deliberately NOT added to PATH here: `_.path` prepends, which
# put /opt/homebrew/bin ahead of mise's own installs and let brew's python and
# ruby shadow the [tools] versions inside this repo. The tasks that need brew
# binaries append it themselves instead, so mise keeps precedence.

# ---------------------------------------------------------------------------
# System packages
# ---------------------------------------------------------------------------
# Anything that must exist before `mise install` can build runtimes belongs
# here rather than in [tools].
#
# The manager prefix is NOT a platform filter in both directions: apt is
# absent on macOS so those entries skip themselves, but Homebrew runs on Linux
# too, so an unfiltered brew list gets installed there as well — duplicating
# the apt list and hard-failing on macOS-only formulas like terminal-notifier,
# which mise tries to build from source and dies on xcodebuild. Hence explicit
# `os` on every entry.

[bootstrap.packages]
# macOS — brew
#
# neovim is deliberately absent from both package lists and declared in
# [tools] instead. LazyVim has a hard minimum version, and apt's neovim is
# below it — Debian 13 ships 0.10.4 against a 0.11.2 floor and stable will not
# move for years, so the editor simply would not load on a bootstrapped Linux
# box. brew happens to be current today, but that is luck rather than a
# guarantee, and two package managers meant two answers to "which nvim".
# mise gives the same 0.12.4 on both platforms from one declaration.
"brew:git" = { version = "latest", os = ["macos"] }
"brew:lsd" = { version = "latest", os = ["macos"] }
"brew:zoxide" = { version = "latest", os = ["macos"] }
"brew:fzf" = { version = "latest", os = ["macos"] }
"brew:zsh-autosuggestions" = { version = "latest", os = ["macos"] }
"brew:gnupg" = { version = "latest", os = ["macos"] }
"brew:tmux" = { version = "latest", os = ["macos"] }
"brew:ripgrep" = { version = "latest", os = ["macos"] }
"brew:fd" = { version = "latest", os = ["macos"] }
"brew:lua" = { version = "latest", os = ["macos"] }
"brew:gh" = { version = "latest", os = ["macos"] }
# LazyVim binds <leader>gg to lazygit and its healthcheck warns without it.
# Deliberately macOS-only: lazygit is not in the Ubuntu LTS apt repos.
"brew:lazygit" = { version = "latest", os = ["macos"] }
"brew:terminal-notifier" = { version = "latest", os = ["macos"] }
# `brew install delta` resolves to git-delta; name it canonically.
"brew:git-delta" = { version = "latest", os = ["macos"] }
# tree-sitter (the lib) and tree-sitter-cli are separate formulas;
# nvim-treesitter needs the CLI for parser compilation.
"brew:tree-sitter-cli" = { version = "latest", os = ["macos"] }
# bin/tmux-claude-save and -restore parse Claude's session JSON with jq and
# abort without it. macOS has shipped /usr/bin/jq (1.7.1-apple) for a while, so
# this is belt-and-braces here — it is the apt entry below that a Linux box
# actually needs. Declared on both so the dependency is stated rather than
# inherited from whatever Apple happens to bundle.
"brew:jq" = { version = "latest", os = ["macos"] }
# .tmux.conf's status-bar click target (MouseDown1StatusRight opens btop via
# .tmux/btop.sh). apt lags brew here — Debian 13 ships 1.3.2 against brew's
# 1.4.7 — but nothing in the click path depends on the newer release.
"brew:btop" = { version = "latest", os = ["macos"] }
"brew-cask:font-inconsolata-nerd-font" = { version = "latest", os = ["macos"] }
# The apps the post-defaults hook pins to the Dock are deliberately NOT
# declared here. Ghostty and Slack do have casks, but Homebrew installed them
# on request and mise refuses to take over a cask it does not own — it fails
# the package with "Homebrew owns this cask", and that aborts the whole
# bootstrap before dotfiles, defaults or tasks ever run. Adopting them would
# mean uninstalling and reinstalling each app through mise, which is a lot to
# risk for a Dock tile. Home Assistant is installed outside brew here, and
# Protect is a wrapped iOS app with no cask at all. The hook leaves anything
# missing unpinned with a note rather than pinning a "?" tile.

# Linux — apt
"apt:zsh" = { version = "latest", os = ["linux"] }
# See the note above — neovim comes from [tools], not apt.
"apt:zoxide" = { version = "latest", os = ["linux"] }
"apt:fzf" = { version = "latest", os = ["linux"] }
"apt:zsh-autosuggestions" = { version = "latest", os = ["linux"] }
"apt:gnupg" = { version = "latest", os = ["linux"] }
"apt:tmux" = { version = "latest", os = ["linux"] }
"apt:ripgrep" = { version = "latest", os = ["linux"] }
"apt:fd-find" = { version = "latest", os = ["linux"] }
"apt:bat" = { version = "latest", os = ["linux"] }
"apt:lua5.4" = { version = "latest", os = ["linux"] }
"apt:gh" = { version = "latest", os = ["linux"] }
"apt:git-delta" = { version = "latest", os = ["linux"] }
# See brew:jq above.
"apt:jq" = { version = "latest", os = ["linux"] }
# See brew:btop above.
"apt:btop" = { version = "latest", os = ["linux"] }
# .tmux/agenda.sh opens with `cal -A 1 -B 1`. Debian splits the BSD tools up
# and `cal` rides in ncal rather than the bsdextrautils that carries the rest,
# so a stock trixie box has no cal at all. macOS ships one.
"apt:ncal" = { version = "latest", os = ["linux"] }
# lsd is in universe on 22.04+ but missing on minimal images; the
# bootstrap:linux-shims task installs the upstream .deb if this no-ops.
"apt:lsd" = { version = "latest", os = ["linux"] }

# ---------------------------------------------------------------------------
# Git checkouts
# ---------------------------------------------------------------------------
# TPM is deliberately NOT here: repos are cloned before dotfiles, so cloning
# into ~/.tmux/plugins/ would create a real ~/.tmux and block the symlink
# below. It lives in the bootstrap:tpm task, which runs last.

[bootstrap.repos]
# .zsh/functions.zsh sources gcd from this fixed path.
"~/Code/github.com/ericboehs/gcd" = { url = "https://github.com/ericboehs/gcd" }

# ---------------------------------------------------------------------------
# Dotfiles
# ---------------------------------------------------------------------------
# Sources are relative to this file. Modes:
#   symlink      — one link for the whole file or directory (the default)
#   symlink-each — real directory, one link per entry, recursing into
#                  subdirectories; use it where something outside the repo
#                  also writes into the target directory

[dotfiles]
"~/.aprc" = ".aprc"
"~/.bundle" = ".bundle"
"~/.default-gems" = ".default-gems"
"~/.fzf.zsh" = ".fzf.zsh"
"~/.gemrc" = ".gemrc"
"~/.gitconfig" = ".gitconfig"
"~/.npmrc" = ".npmrc"
"~/.p10k.zsh" = ".p10k.zsh"
"~/.rgignore" = ".rgignore"
"~/.tmux.conf" = ".tmux.conf"
"~/.zprofile" = ".zprofile"
"~/.zshrc" = ".zshrc"
# Contains the zsh plugin submodules; .zshrc sources them from $HOME/.zsh/.
"~/.zsh" = ".zsh"
# Renames: the repo tracks .example/.global names, $HOME wants the real ones.
"~/.gitignore" = ".gitignore.global"
"~/.gitconfig.private" = ".gitconfig.private.example"
"~/.gitconfig.va-ghe" = ".gitconfig.va-ghe.example"
# TPM installs into ~/.tmux/plugins/, which .gitignore excludes, so the whole
# directory can be one link — which is also what gets every helper script
# .tmux.conf binds (agenda.sh, btop.sh, goto-window.sh, move-window.sh,
# session-jump.sh, theme-sync.sh) onto a fresh machine.
"~/.tmux" = ".tmux"
# .zsh/path.zsh puts ~/bin at the front of $PATH, but nothing created it — on
# this machine it was a hand-made symlink from years back, so the gap only
# showed up on a pristine VM: every script the README documents (claude-man,
# gh-pm, vm, notes, …) was simply missing. One link, not symlink-each, so new
# scripts appear without re-running bootstrap.
"~/bin" = "bin"

"~/.config/nvim" = ".config/nvim"
"~/.config/mise/config.toml" = ".config/mise/config.toml"
# btop rewrites btop.conf on exit, so only the themes directory is managed.
"~/.config/btop/themes" = { source = ".config/btop/themes", mode = "symlink-each" }
"~/.config/lsd" = { source = ".config/lsd", mode = "symlink-each" }
"~/.config/gitleaks" = { source = ".config/gitleaks", mode = "symlink-each" }
# Ghostty writes nothing here, but $HOME already has a real directory.
"~/.config/ghostty" = { source = ".config/ghostty", mode = "symlink-each" }

# ~/.claude/ is Claude Code runtime state and ~/.gem/ is runtime state for
# `gem` (it writes credentials there on push), so link individual files.
"~/.claude/scripts/statusline.sh" = ".claude/scripts/statusline.sh"
"~/.gem/credentials" = ".gem/credentials"

# Pi keeps credentials, sessions, downloaded packages, caches, and generated
# model catalogs alongside configuration. Link only reviewed stable files;
# never link the entire ~/.pi/agent directory.
#
# settings.json is deliberately absent: pi rewrites it at runtime, so one
# shared copy meant every machine carried a permanent conflicting diff of the
# same file. bootstrap:pi links the per-host .pi-agent/settings.<host>.json.
"~/.pi/agent/keybindings.json" = ".pi-agent/keybindings.json"
"~/.pi/agent/approval-guardian.json" = ".pi-agent/approval-guardian.json"
"~/.pi/agent/extensions" = { source = ".pi-agent/extensions", mode = "symlink-each" }

# ---------------------------------------------------------------------------
# macOS defaults
# ---------------------------------------------------------------------------
# Curated sections compile down to the same `defaults write` calls but read
# better; raw [bootstrap.macos.defaults] covers everything else.

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"

[bootstrap.macos.dock]
tilesize = 99
show_recents = false
mru_spaces = false

[bootstrap.macos.keyboard]
initial_key_repeat = 15
key_repeat = 2
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
AppleKeyboardUIMode = 3
NSNavPanelExpandedStateForSaveMode = true
NSNavPanelExpandedStateForSaveMode2 = true
NSAutomaticSpellingCorrectionEnabled = false
NSAutomaticDashSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false

[bootstrap.macos.defaults."com.apple.finder"]
FXDefaultSearchScope = "SCcf"
_FXShowPosixPathInTitle = true
_FXSortFoldersFirst = true

[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

# `location` is set in the pre-defaults hook instead: values here are written
# literally, with no template expansion or tilde handling, so there's no way
# to spell $HOME.
[bootstrap.macos.defaults."com.apple.screencapture"]
type = "png"
disable-shadow = true

[bootstrap.macos.defaults."com.apple.dock"]
no-bouncing = true
mineffect = "scale"

[bootstrap.macos.defaults."com.apple.Safari"]
ShowFullURLInSmartSearchField = true
IncludeDevelopMenu = true
WebKitDeveloperExtrasEnabledPreferenceKey = true
"com.apple.Safari.ContentPageGroupIdentifier.WebKit2DeveloperExtrasEnabled" = true
SendDoNotTrackHTTPHeader = true

[bootstrap.macos.defaults."com.apple.TextEdit"]
RichText = 0
PlainTextEncoding = 4
PlainTextEncodingForWrite = 4

# ---------------------------------------------------------------------------
# Hooks — the imperative bits that have no declarative equivalent
# ---------------------------------------------------------------------------
# Hooks fire regardless of platform, so each guards itself on `uname`.

[bootstrap.hooks]
pre-packages = '''
if [ "$(uname)" = Darwin ] && ! command -v brew >/dev/null; then
  # SSH non-interactive sessions don't load ~/.zprofile, so look in the
  # standard Apple Silicon / Intel locations before installing.
  for p in /opt/homebrew/bin /usr/local/bin; do
    [ -x "$p/brew" ] && export PATH="$p:$PATH" && break
  done
  if ! command -v brew >/dev/null; then
    NONINTERACTIVE=1 /bin/bash -c \
      "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  fi
fi
if [ "$(uname)" = Linux ] && command -v apt-get >/dev/null; then
  sudo apt-get update -qq
fi
'''

# Submodules back .zsh/{powerlevel10k,fast-syntax-highlighting,
# zsh-autosuggestions} and .tmux/extrakto, all of which are symlinked into
# $HOME as part of their parent directory — so they must be populated first.
pre-dotfiles = "git submodule update --init --recursive"

pre-defaults = '''
[ "$(uname)" = Darwin ] || exit 0
# Quit System Settings so it doesn't override our writes.
osascript -e 'tell application "System Settings" to quit' 2>/dev/null || true
mkdir -p ~/Pictures/Screenshots
defaults write com.apple.screencapture location -string "$HOME/Pictures/Screenshots"
'''

post-defaults = '''
[ "$(uname)" = Darwin ] || exit 0
# Per-host, so it can't be expressed in [bootstrap.macos.defaults].
defaults -currentHost write NSGlobalDomain com.apple.mouse.tapBehavior -int 1

# The Dock's pinned apps, in order. persistent-apps is an array of dicts, each
# carrying a binary bookmark blob, so [bootstrap.macos.defaults] — which writes
# scalars — has no way to express it. Path and label are all that need writing:
# the Dock regenerates the bookmark, the bundle id and the rest of tile-data
# when it next starts, which the killall at the bottom provides.
#
# Safari is listed at its cryptex path because that is where macOS actually
# keeps it; /Applications/Safari.app is a stub.
dock_apps='/System/Volumes/Preboot/Cryptexes/App/System/Applications/Safari.app
/System/Applications/Mail.app
/System/Applications/Messages.app
/Applications/Ghostty.app
/Applications/Slack.app
/System/Applications/Utilities/Screen Sharing.app
/Applications/Home Assistant.app
/System/Applications/iPhone Mirroring.app
/Applications/Protect.app'

# Read back what is pinned as a list of bundle names. Compare on those rather
# than on paths: the Dock answers with the path it resolved and percent-encodes
# it, so "Screen Sharing.app" returns as "Screen%20Sharing.app" and a path
# comparison would see drift on a converged machine and rewrite the Dock on
# every single bootstrap.
dock_names() {
  sed -n 's/.*"_CFURLString" = "\(.*\)";/\1/p' \
    | sed -e 's|/$||' -e 's|.*/||' -e 's/%\([0-9A-Fa-f][0-9A-Fa-f]\)/\\x\1/g' \
    | while IFS= read -r name; do printf '%b\n' "$name"; done
}

want=''
set --
# Fed by heredoc rather than a pipe so the loop stays in this shell and the
# positional parameters it builds survive it.
while IFS= read -r app; do
  # An app that isn't installed would pin as a "?" placeholder, so leave it off
  # and say so — a half-provisioned machine gets an honest Dock, not a broken
  # one, and re-running bootstrap after installing it puts the tile back.
  if [ ! -e "$app" ]; then
    echo "dock: not installed, leaving unpinned: $app" >&2
    continue
  fi
  label=${app##*/}; label=${label%.app}
  want="$want${app##*/}
"
  set -- "$@" "<dict><key>tile-data</key><dict><key>file-data</key><dict>\
<key>_CFURLString</key><string>$app</string>\
<key>_CFURLStringType</key><integer>0</integer></dict>\
<key>file-label</key><string>$label</string></dict>\
<key>tile-type</key><string>file-tile</string></dict>"
done <<EOF
$dock_apps
EOF

# Only write on an actual mismatch. The killall below restarts the Dock either
# way, but a needless write throws away the bookmarks it took a launch to build.
#
# The empty case is guarded because `defaults write -array` with no arguments
# is not a no-op — it writes an empty array and unpins everything. That needs
# every declared app to be missing at once, which on macOS means something has
# gone badly wrong; wiping the Dock is not the way to report it.
if [ "$#" -eq 0 ]; then
  echo "dock: none of the declared apps are installed — leaving the Dock alone" >&2
elif [ "$(defaults read com.apple.dock persistent-apps 2>/dev/null | dock_names)" \
       != "$(printf '%s' "$want")" ]; then
  # Said out loud: this silently reverts anything pinned by hand since the last
  # run, and a Dock that rearranges itself with no explanation is a mystery.
  echo "dock: repinning $# app(s) to match mise.toml"
  defaults write com.apple.dock persistent-apps -array "$@"
fi

for app in Finder Dock SystemUIServer; do
  killall "$app" >/dev/null 2>&1 || true
done
'''

final = '''
command -v gh >/dev/null && ! gh auth status >/dev/null 2>&1 && \
  echo "  gh auth login                       # octo.nvim, gh CLI"
command -v op >/dev/null || case "$(uname)" in
  Darwin) echo "  brew install --cask 1password-cli   # for fnox + secrets" ;;
  # Handing a Linux box a brew command is advice it cannot follow.
  *) echo "  https://developer.1password.com/docs/cli/get-started/  # for fnox + secrets" ;;
esac
# This used to say on-demand parser installs were expected — true before
# bootstrap:nvim installed all of them, and actively misleading now: it tells
# you to shrug off the one visible symptom of the warm having half-failed.
echo "Note: bootstrap:nvim installs every treesitter parser, so opening a new"
echo "      filetype should install nothing. If nvim starts compiling parsers,"
echo "      the warm did not finish — re-run \`mise run bootstrap:nvim\`."
'''

# ---------------------------------------------------------------------------
# Tasks — run last, after packages, dotfiles and [tools] are all in place
# ---------------------------------------------------------------------------

[tasks.bootstrap]
description = "Post-converge setup that needs the installed tools on PATH"
depends = ["bootstrap:linux-shims", "bootstrap:tpm", "bootstrap:nvim", "bootstrap:pi", "bootstrap:claude"]

[tasks."bootstrap:linux-shims"]
description = "Debian binary-name shims, lsd fallback, zsh login shell"
run = '''
[ "$(uname)" = Linux ] || exit 0
# Debian ships fd as fdfind and bat as batcat.
mkdir -p "$HOME/.local/bin"
[ -x /usr/bin/fdfind ] && ln -sf /usr/bin/fdfind "$HOME/.local/bin/fd"
[ -x /usr/bin/batcat ] && ln -sf /usr/bin/batcat "$HOME/.local/bin/bat"
# apt:lsd silently no-ops on minimal images; fall back to the GitHub release.
if ! command -v lsd >/dev/null; then
  tmp=$(mktemp -d)
  curl -fsSL -o "$tmp/lsd.deb" \
    "https://github.com/lsd-rs/lsd/releases/latest/download/lsd-musl_$(dpkg --print-architecture).deb"
  sudo dpkg -i "$tmp/lsd.deb"
  rm -rf "$tmp"
fi
# [bootstrap.user].login_shell takes one absolute path and can't vary by
# platform; macOS already defaults to zsh, so only Linux needs this.
if [ "$SHELL" != "$(command -v zsh)" ]; then
  sudo chsh -s "$(command -v zsh)" "$USER"
fi
'''

[tasks."bootstrap:tpm"]
description = "Install tmux plugin manager and its plugins"
run = '''
# Tasks run in a non-login shell, so .zprofile's path_helper line never fires
# and Homebrew's bin is missing — on a fresh Mac that made this task fail
# outright even though `mise bootstrap` had just installed tmux. Appended, not
# prepended, so brew fills the gap without shadowing mise-managed tools.
# (/usr/local/bin is the Intel prefix; a path that doesn't exist is ignored.)
#
# Within that appended group ~/.local/bin comes first, matching the other two
# tasks: a stale brew mise otherwise wins over the one mise.run installed and
# fails their version check. This task never shells out to mise, so the order
# costs it nothing — but the other two point here for the reasoning.
export PATH="$PATH:$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin"
# install_plugins shells out to tmux; without it TPM aborts with a confusing
# "not configured in tmux.conf". Say why and move on rather than failing the
# whole bootstrap.
if ! command -v tmux >/dev/null; then
  echo "bootstrap:tpm: tmux not on PATH — skipping plugin install" >&2
  exit 0
fi
[ -d ~/.tmux/plugins/tpm ] || \
  git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
~/.tmux/plugins/tpm/bin/install_plugins
'''

[tasks."bootstrap:nvim"]
description = "Sync Lazy.nvim plugins and pre-compile treesitter parsers"
run = '''
# See bootstrap:tpm — non-login PATH has no Homebrew. Appended so mise's own
# tool installs keep precedence over brew's copies.
#
# ~/.local/bin is where mise.run puts mise, and it has to be here for mason's
# gem-backed packages (erb-formatter, erb_lint) to install: mise ships a
# rubygems plugin that shells out to `mise reshim` after installing any gem with
# executables, and `mise exec` does not put mise itself on PATH. Without it the
# hook dies with ENOENT, gem exits 1, and mason reports a failure — the gem
# files land, so it looks like a mystery. It has to come BEFORE
# /opt/homebrew/bin too: a brew mise older than min_version above wins
# otherwise, and `mise reshim` hard-exits 1 on the version check rather than
# ENOENT — same broken hook, different error, and it only starts happening
# once brew's copy goes stale. The cirruslabs VM base image ships one.
export PATH="$PATH:$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin"
# A bare `|| exit 0` here hid a real failure once: nvim was installed but not
# on the task's PATH, so this skipped without a word and no parsers compiled.
if ! command -v nvim >/dev/null; then
  echo "bootstrap:nvim: nvim not on PATH — skipping plugin sync" >&2
  exit 0
fi
# LazyVim enforces its minimum nvim version by printing the error and then
# calling vim.fn.getchar() — which under --headless waits on a keypress that
# can never arrive. stdin is already /dev/null and it still sleeps in
# epoll_wait forever, so the task never returns, `mise bootstrap` never
# finishes, and nothing times out to rescue it. Debian 13 ships neovim 0.10.4
# and stable will hold there for years, so on Linux this is the ordinary path,
# not an edge case. Exits 0 like the guard above: an unwarmed nvim is a
# degraded machine, not a failed bootstrap, and the final hook already says how
# to spot one.
nvim_floor=0.11.2
nvim_version=$(nvim --version | sed -n '1s/^NVIM v\([0-9][0-9.]*\).*/\1/p')
if [ -z "$nvim_version" ] || \
   [ "$(printf '%s\n%s\n' "$nvim_floor" "$nvim_version" | sort -V | head -1)" != "$nvim_floor" ]; then
  echo "bootstrap:nvim: nvim ${nvim_version:-(version unreadable)} is below \
LazyVim's $nvim_floor floor — skipping. Distro packages lag; install a current \
neovim and re-run \`mise run bootstrap:nvim\`." >&2
  exit 0
fi
parsers() { ls ~/.local/share/nvim/site/parser 2>/dev/null | wc -l | tr -d ' '; }

# Mason starts installing LazyVim's tool list as soon as its config runs, and
# `Lazy! sync` triggers that on a cold bootstrap — so this invocation has to
# drain the queue before +qa. It did not, and every cold run printed "Neovim
# exited while the following packages were installing. Installation was
# aborted" naming 7 of the 10 tools, then deferred them to the user's first
# real launch: exactly the surprise this task exists to prevent.
#
# The wait needs a quiet period, not a single idle sample: mason queues its
# downloads, so there are moments early on when nothing is installing yet and
# the queue is far from empty. Waiting on `no package is installing` alone
# returned immediately and nvim exited mid-download.
#
# That period is measured against the clock rather than by counting callbacks.
# vim.wait's interval is a ceiling on how long it sleeps between polls, not a
# cadence: with interval=1000 the callback still fired 16 times in 3s on an
# idle machine, so a `>= 15` counter was a ~5s wait wearing a 15s label. Worse,
# every libuv wakeup runs it, so an install in flight makes the counter finish
# sooner — it declared the queue quiet fastest exactly when mason was busiest.
#
# A package can also just fail — erb-formatter and erb_lint are gems, so they
# need a usable ruby, and mason only says so in ~/.local/state/nvim/mason.log.
# Surface the names here instead, since a silent 8-of-10 is what sends you back
# to the editor wondering.
#
# get_all_packages() is wrapped because mason re-downloads registry.json every
# time mason.nvim loads, and the file is empty for a moment mid-write — a poll
# landing in that window gets "Expected value but found T_END at character 1"
# out of the JSON decode. The throw propagates out of vim.wait's callback and
# aborts the whole wait, so the drain is skipped and nvim exits with the queue
# still full: the exact failure this block exists to prevent, and it reads as a
# mason bug rather than a race. coop hit it on every run; the Macs got lucky on
# timing. An unreadable registry counts as busy, never as quiet.
# LazyVim queues its language servers through mason-lspconfig's ensure_installed,
# and mason-lspconfig skips that feature outright when headless
# (mason-lspconfig/init.lua: `if not platform.is_headless and ...`). So a headless
# bootstrap installs the tools list — stylua, shfmt, the linters — and none of the
# ~16 servers the extras in .config/nvim/lazyvim.json ask for. The machines that
# looked converged were the ones nvim had also been opened on by hand; coop, which
# has only ever been bootstrapped over ssh, sat at 11 packages instead of 27.
#
# Call the feature directly. It has to come after nvim-lspconfig's config runs,
# since that is what calls mason-lspconfig.setup() and populates the list. pcall'd
# because this is a private module path — a rename upstream should cost the LSP
# servers, not the whole task.
mason_lsp="lua local ok, err = pcall(function()
       require('mason-lspconfig.features.ensure_installed')()
     end)
     if not ok then
       io.stderr:write('bootstrap:nvim: could not queue LSP servers: ' ..
         tostring(err) .. '\n')
     end"

mason_drain="lua local r = require('mason-registry')
     local failed = {}
     r:on('package:install:failed', function(p) failed[#failed + 1] = p.name end)
     local quiet_since
     vim.wait(1800000, function()
       local ok, busy = pcall(function()
         return #vim.tbl_filter(function(p) return p:is_installing() end,
                                r.get_all_packages())
       end)
       if not ok then quiet_since = nil return false end
       if busy > 0 then quiet_since = nil
       elseif not quiet_since then quiet_since = vim.uv.now() end
       return quiet_since ~= nil and vim.uv.now() - quiet_since >= 15000
     end, 1000)
     if #failed > 0 then
       io.stderr:write('bootstrap:nvim: mason could not install ' ..
         table.concat(failed, ', ') .. ' — see ~/.local/state/nvim/mason.log\n')
     end"

# `Lazy! sync` is non-interactive (no UI prompts). Stderr can be noisy
# during first install (treesitter parsers compiling); keep it visible.
nvim --headless "+Lazy! sync" "+Lazy! load mason.nvim" \
  "+Lazy! load nvim-lspconfig" "+$mason_lsp" "+$mason_drain" +qa

# Fully load nvim-treesitter (LazyVim lazy-loads it by filetype, but headless
# never triggers a filetype event), then block on install. 5-10 min on a good
# first run. Each parser is a separate GitHub download, and ~300 of them back
# to back reliably draws 429s (plus whatever 502/503 GitHub is serving that
# day) — install() resolves anyway, so one pass exits 0 having quietly skipped
# a third of the list. Retry until a pass stops adding parsers.
prev=-1
attempt=0
while [ "$(parsers)" != "$prev" ]; do
  prev=$(parsers)
  attempt=$((attempt + 1))
  if [ "$attempt" -gt 8 ]; then
    echo "bootstrap:nvim: still gaining parsers after 8 passes — giving up at \
$prev. Re-run this task once the network settles." >&2
    break
  fi
  # A failed download leaves its extract dir behind, and the next attempt dies
  # on ENOTEMPTY trying to rename over it.
  rm -rf ~/.cache/nvim/tree-sitter-*-tmp
  nvim --headless "+Lazy! load nvim-treesitter" \
    "+lua require('nvim-treesitter').install('all'):wait(1800000)" +qa
  echo "bootstrap:nvim: $(parsers) treesitter parsers after pass $attempt"
done

# The sync above normally finishes mason off. This is the backstop for anything
# queued since — a tool whose install only registers once mason.nvim is loaded
# outright — and it re-reports failures. A ~15s no-op when there is nothing left.
nvim --headless "+Lazy! load mason.nvim" "+Lazy! load nvim-lspconfig" \
  "+$mason_lsp" "+$mason_drain" +qa

echo "bootstrap:nvim: $(parsers) parsers, \
$(ls ~/.local/share/nvim/mason/packages 2>/dev/null | wc -l | tr -d ' ') mason packages, \
$(ls ~/.local/share/nvim/lazy 2>/dev/null | wc -l | tr -d ' ') plugins"
'''

[tasks."bootstrap:pi"]
description = "Install pinned Pi packages from the tracked global settings"
run = '''
# Tasks run in a non-login shell. Keep mise's own install ahead of a stale
# Homebrew copy while still making Homebrew-provided helpers available.
export PATH="$PATH:$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin"

if ! command -v pi >/dev/null; then
  echo "bootstrap:pi: pi is not on PATH after the tools step" >&2
  exit 1
fi

# Settings are per host. pi rewrites this file as you work — model switches,
# lastChangelogVersion, dismissed warnings — so a single shared copy leaves
# every machine with a permanent uncommitted diff and turns each pull into a
# conflict. Each host gets its own tracked file instead, seeded from
# settings.default.json, which carries only the machine-neutral preferences.
root="${MISE_PROJECT_ROOT:-$PWD}"
# The host key defaults to the short hostname, but this directory is published,
# and a work machine's hostname is an asset tag nobody needs to read. Write a
# neutral name into the untracked .pi-agent/host to override it.
host="${PI_SETTINGS_HOST:-}"
if [ -z "$host" ] && [ -f "$root/.pi-agent/host" ]; then
  host="$(tr -d '[:space:]' < "$root/.pi-agent/host")"
fi
[ -n "$host" ] || host="$(hostname -s | tr '[:upper:]' '[:lower:]')"
settings="$root/.pi-agent/settings.$host.json"
if [ ! -f "$settings" ]; then
  cp "$root/.pi-agent/settings.default.json" "$settings"
  echo "bootstrap:pi: seeded .pi-agent/settings.$host.json — review and commit it"
fi
mkdir -p "$HOME/.pi/agent"
if [ -e "$HOME/.pi/agent/settings.json" ] && [ ! -L "$HOME/.pi/agent/settings.json" ]; then
  mv "$HOME/.pi/agent/settings.json" "$HOME/.pi/agent/settings.json.bak"
  echo "bootstrap:pi: kept the previous settings at ~/.pi/agent/settings.json.bak" >&2
fi
ln -sfn "$settings" "$HOME/.pi/agent/settings.json"

# Custom providers are per host too, and only the work laptop has one: a local
# copilot-api proxy that pi reaches over http. Hosts without a models.<host>.json
# keep whatever they have, since pi treats a missing models.json as "no custom
# providers" rather than an error.
models="$root/.pi-agent/models.$host.json"
if [ -f "$models" ]; then
  if [ -e "$HOME/.pi/agent/models.json" ] && [ ! -L "$HOME/.pi/agent/models.json" ]; then
    mv "$HOME/.pi/agent/models.json" "$HOME/.pi/agent/models.json.bak"
    echo "bootstrap:pi: kept the previous models.json at ~/.pi/agent/models.json.bak" >&2
  fi
  ln -sfn "$models" "$HOME/.pi/agent/models.json"
fi

# `pi update --extensions` reconciles the pinned git checkout but deliberately
# skips pinned npm sources. Install those exact npm specs directly: `pi install`
# would rewrite the tracked settings file based on stale package-manager state.
packages=$(mktemp)
sources=$(mktemp)
trap 'rm -f "$packages" "$sources"' EXIT
# A freshly seeded host has no packages at all, and `.packages[]` on a missing
# key aborts jq rather than yielding nothing.
jq -r '(.packages // [])[] | if type == "string" then . else .source end' \
  "$HOME/.pi/agent/settings.json" > "$sources"
PI_SKIP_VERSION_CHECK=1 pi update --extensions

set --
while IFS= read -r source; do
  case "$source" in
    npm:*) set -- "$@" "${source#npm:}" ;;
  esac
done < "$sources"
if [ "$#" -gt 0 ]; then
  # The global npm config requires a 10-day release age for unpinned
  # resolution. These are exact reviewed pins, so scope the exception to this
  # isolated reproducible install instead of weakening the global setting.
  NPM_CONFIG_MIN_RELEASE_AGE=0 npm install \
    --prefix "$HOME/.pi/agent/npm" \
    --save-exact --legacy-peer-deps --omit=dev \
    "$@"
fi

# The global .npmrc sets ignore-scripts=true, so npm never runs the install
# scripts that compile native addons — most notably better-sqlite3, a
# transitive dep of pi-hermes-memory that session indexing needs. Without it,
# `pi` fails with "Could not locate the bindings file". Rebuild native modules
# with scripts enabled, scoping the exception to this reproducible install
# rather than weakening the global setting.
if [ -d "$HOME/.pi/agent/npm/node_modules/better-sqlite3" ]; then
  npm rebuild better-sqlite3 \
    --prefix "$HOME/.pi/agent/npm" \
    --ignore-scripts=false --foreground-scripts
fi

PI_SKIP_VERSION_CHECK=1 pi list > "$packages"
while IFS= read -r source; do
  path=$(awk -v source="  $source" '
    $0 == source {
      if ((getline path) > 0 && path ~ /^    \//) { sub(/^ +/, "", path); print path; found = 1 }
    }
    END { exit !found }
  ' "$packages") || {
    echo "bootstrap:pi: package was not installed: $source" >&2
    exit 1
  }
  # `pi list` echoes the pin from settings, not the commit that is checked out,
  # so a git package can sit on an old revision while every signal says it is
  # current. That is how the Linux box ran a superseded extension for a day:
  # the pin moved in a pull, the launch was clean, no warning appeared, and
  # nothing ever compared the two. `pi update --extensions` above does move a
  # changed pin; this only proves it did.
  case "$source" in
    git:*@*)
      want=${source##*@}
      # mise renders this script through Tera first, and shell length
      # expansion opens what Tera reads as an unterminated comment, so
      # measure the pin with wc instead.
      len=$(printf '%s' "$want" | wc -c | tr -d ' ')
      if [ "$len" -eq 40 ] && [ -z "$(printf '%s' "$want" | tr -d '0-9a-f')" ]; then
        have=$(git -C "$path" rev-parse HEAD 2>/dev/null || true)
        [ "$have" = "$want" ] || {
          echo "bootstrap:pi: $source is checked out at ${have:-an unknown revision}" >&2
          exit 1
        }
      fi
      ;;
  esac
done < "$sources"

printf 'bootstrap:pi: '
pi --version

# pi's Node build loads 177 ES modules before it paints the first frame.
# bin/pi-bundle collapses them into one file and repoints the `pi` bin at
# bin/pi-launch, which is worth ~150ms per launch. Strictly an optimization:
# the launcher falls back to dist/cli.js whenever the bundle is missing or
# older than the package, so a failure here costs speed and nothing else.
pi_bundle="${MISE_PROJECT_ROOT:-.}/bin/pi-bundle"
[ -x "$pi_bundle" ] || pi_bundle="$HOME/bin/pi-bundle"
if [ -x "$pi_bundle" ]; then
  printf 'bootstrap:pi: '
  # Neither machine authenticates bedrock, and registering it costs 32ms of AWS
  # SDK evaluation on every launch. pi-bundle ignores this and keeps bedrock if
  # it finds bedrock credentials, so adding the provider later still works.
  PI_BUNDLE_NO_BEDROCK=1 "$pi_bundle" || echo "bootstrap:pi: bundling failed, staying on the stock entrypoint" >&2
else
  echo "bootstrap:pi: bin/pi-bundle not found, staying on the stock entrypoint" >&2
fi
'''

[tasks."bootstrap:claude"]
description = "Install Claude Code from its native, self-updating installer"
run = '''
# See bootstrap:tpm — non-login PATH has no Homebrew, and ~/.local/bin is
# where mise.run puts mise, which the npm-cleanup branch below shells out to.
export PATH="$PATH:$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin"

# Deliberately not a [tools] entry. The npm package ships a stub cli.js and
# fetches the real per-platform binary from its postinstall — and .npmrc sets
# ignore-scripts=true, so every npm-backed install lands a `claude` that dies
# with "native binary not installed" the moment you run it. That also takes
# out auto-update, since the updater reinstalls through the same npm path.
# The official installer sidesteps npm entirely: one binary under
# ~/.local/share/claude/versions, symlinked from ~/.local/bin/claude, which
# updates itself in the background from then on.

# An npm-global copy left over from before shadows the good one: mise's shims
# directory sorts ahead of ~/.local/bin on PATH, and node's bin dir gets a
# shim. Drop the package, then reshim so the shim goes with it.
if command -v mise >/dev/null &&
   mise exec node -- npm ls -g --depth=0 @anthropic-ai/claude-code >/dev/null 2>&1; then
  echo "bootstrap:claude: removing the npm-global copy that shadows ~/.local/bin"
  mise exec node -- npm uninstall -g @anthropic-ai/claude-code >/dev/null
  mise reshim
fi

# Version check rather than a bare -x test, so a half-installed or broken
# binary reinstalls instead of being taken for a working one.
if "$HOME/.local/bin/claude" --version >/dev/null 2>&1; then
  echo "bootstrap:claude: $("$HOME/.local/bin/claude" --version) already installed"
  exit 0
fi
curl -fsSL https://claude.ai/install.sh | bash
'''
