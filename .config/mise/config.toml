[env]
BAT_THEME = "ansi"
DISABLE_SPRING = "true"
DOCKER_SCAN_SUGGEST = "false"
VTK_DISABLE_ANALYTICS = "true"
CLAUDE_NOTIFY_SLACK = "true"
OBJC_DISABLE_INITIALIZE_FORK_SAFETY = "YES"
OP_BIOMETRIC_UNLOCK_ENABLED = "true"
GITLEAKS_CONFIG = "{{env.HOME}}/.config/gitleaks/config.toml"

[settings]
ruby.compile = false
idiomatic_version_file_enable_tools = ["node"]

[tools]
python = "3.12"
bun = "latest"
node = "24"
ruby = "4"
fnox = "latest"
# Dev-env tooling: gitleaks (pre-commit secret scanning, referenced by
# the .gitconfig hook), hk (project pre-commit manager, takes hk.pkl),
# pkl (Apple's config language hk uses), watchexec (file-watch task runner).
gitleaks = "latest"
hk = "latest"
pkl = "latest"
watchexec = "latest"
# LazyVim's terraform extra hardcodes the terraform_fmt formatter and the
# terraform_validate linter, so opening a .tf file without the binary throws
# "Error running terraform: ENOENT". Here rather than in [bootstrap.packages]
# because homebrew-core dropped the formula over the BUSL relicense, and mise's
# brew backend refuses third-party taps ("the tap must publish API metadata …
# mise will not proxy to the brew CLI") — which fails the whole packages step,
# not just that entry.
terraform = "latest"
aube = "latest"
"npm:@playwright/cli" = "latest"
