[env]
BAT_THEME = "ansi"
DISABLE_SPRING = "true"
DOCKER_SCAN_SUGGEST = "false"
VTK_DISABLE_ANALYTICS = "true"
CLAUDE_NOTIFY_SLACK = "true"
OBJC_DISABLE_INITIALIZE_FORK_SAFETY = "YES"
OP_BIOMETRIC_UNLOCK_ENABLED = "true"
GITLEAKS_CONFIG = "{{env.HOME}}/.config/gitleaks/config.toml"

[settings]
ruby.compile = false
idiomatic_version_file_enable_tools = ["node"]

[tools]
python = "3.12"
bun = "latest"
node = "24"
ruby = "4"
fnox = "latest"
# Dev-env tooling: gitleaks (pre-commit secret scanning, referenced by
# the .gitconfig hook), hk (project pre-commit manager, takes hk.pkl),
# pkl (Apple's config language hk uses), watchexec (file-watch task runner).
gitleaks = "latest"
hk = "latest"
pkl = "latest"
watchexec = "latest"
aube = "latest"
# Pinned, not "latest": this file is symlinked into ~/.config, so a version mise
# cannot resolve warns on every shell init — which is enough console output to
# trip Powerlevel10k's instant-prompt guard. A pin keeps working through a
# GitHub releases-API outage. Also satisfies the LazyVim terraform extra, which
# otherwise errors with ENOENT on every .tf buffer.
terraform = "1.15.8"
# The editor, declared here rather than left to brew/apt: LazyVim enforces a
# minimum nvim version, and Debian 13's apt gives 0.10.4 against a 0.11.2
# floor, so LazyVim refuses to load on a freshly bootstrapped Linux box.
# Pinned for the same reason terraform is, plus one of its own — an
# unresolvable "latest" would leave nvim below the floor again, which is the
# failure this entry exists to prevent.
neovim = "0.12.4"
"npm:@playwright/cli" = "latest"
