[env]
BAT_THEME = "ansi"
DISABLE_SPRING = "true"
DOCKER_SCAN_SUGGEST = "false"
VTK_DISABLE_ANALYTICS = "true"
# Moshi is the away channel now — it speaks the notification wherever I am, so
# the Slack posts were the same news arriving twice. Banners still draw locally.
# Flip back to "true" (with AWAY_ONLY below) if Moshi is ever off the air.
AGENT_NOTIFY_SLACK = "false"
# Only consulted when AGENT_NOTIFY_SLACK is true: banner while I am at the desk,
# Slack when I am not. Away means a dark display or a VNC session, since I dial
# in from my phone.
AGENT_NOTIFY_SLACK_AWAY_ONLY = "true"
OBJC_DISABLE_INITIALIZE_FORK_SAFETY = "YES"
OP_BIOMETRIC_UNLOCK_ENABLED = "true"
GITLEAKS_CONFIG = "{{env.HOME}}/.config/gitleaks/config.toml"

[settings]
ruby.compile = false
idiomatic_version_file_enable_tools = ["node"]

[tools]
python = "3.14"
bun = "latest"
node = "26"
ruby = "4"
fnox = "latest"
# Python's package/tool runner, and the one thing here that was already on
# the machine without anything declaring it — an ad-hoc brew install a full
# major behind (0.8.22) that a fresh bootstrap would never have made. Any
# `uv tool` or `uv run` invocation was silently depending on that.
uv = "latest"
# Dev-env tooling: gitleaks (pre-commit secret scanning, referenced by
# the .gitconfig hook), hk (project pre-commit manager, takes hk.pkl),
# pkl (Apple's config language hk uses), watchexec (file-watch task runner).
gitleaks = "latest"
hk = "latest"
pkl = "latest"
# Pinned, not "latest": CI lints the same scripts with the same binary, and
# shellcheck adds checks between releases — a floating version means the job and
# the machine disagree about what is clean. Bumping this is a deliberate act:
# every tracked script has to be clean under the new version.
shellcheck = "0.11.0"
# Pinned for the same reason as shellcheck: rubocop adds cops between releases,
# and CI and this machine have to agree on what counts as clean. The repo's
# .rubocop.yml keeps it to the Lint and Security departments.
"gem:rubocop" = "1.89.0"
watchexec = "latest"
aube = "latest"
# Pinned, not "latest": this file is symlinked into ~/.config, so a version mise
# cannot resolve warns on every shell init — which is enough console output to
# trip Powerlevel10k's instant-prompt guard. A pin keeps working through a
# GitHub releases-API outage. Also satisfies the LazyVim terraform extra, which
# otherwise errors with ENOENT on every .tf buffer.
terraform = "1.15.8"
# The editor, declared here rather than left to brew/apt: LazyVim enforces a
# minimum nvim version, and Debian 13's apt gives 0.10.4 against a 0.11.2
# floor, so LazyVim refuses to load on a freshly bootstrapped Linux box.
# Pinned for the same reason terraform is, plus one of its own — an
# unresolvable "latest" would leave nvim below the floor again, which is the
# failure this entry exists to prevent.
neovim = "0.12.4"
"npm:@playwright/cli" = "latest"
# Pi is pinned so its extension API and the bootstrapped package set move together.
# After an upgrade lands here, run `mise task bootstrap:pi` — that re-bundles
# dist/bundle.mjs, which pi-launch requires or it degrades every launch to
# dist/cli.js (~115ms slower). The footer's staleness self-heal re-bundles on
# its own within one refresh TTL, so forgetting this costs one slow launch,
# not days.
"npm:@earendil-works/pi-coding-agent" = "0.84.4"
